<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cordão 1 Elo Masculino</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0d0d0d;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:320px;
      background:#161616;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 20px rgba(255,0,255,.2);
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      display:block;
    }

    .card h2{
      padding:15px;
      color:#ff00ff;
    }

    .card p{
      padding:0 15px 20px;
      color:#ccc;
    }

    .btn{
      display:block;
      margin:15px;
      padding:12px;
      text-align:center;
      background:#ff00ff;
      color:white;
      text-decoration:none;
      border-radius:10px;
      transition:.3s;
    }

    .btn:hover{
      background:#cc00cc;
    }

  </style>
</head>

<body>
